
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#170e14">

<title>Campaign Submissions | St. Columbus Public School</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #170e14;
  --panel: #261821;
  --panel-light: #30202a;
  --gold: #d8ad68;
  --gold-light: #f0d5a0;
  --cream: #f7eddf;
  --muted: #b9a8a2;
  --border: rgba(216,173,104,.2);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 35px 5%;
  background: var(--bg);
  color: var(--cream);
  font-family: "DM Sans", sans-serif;
}

button {
  font: inherit;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding-bottom: 25px;
  border-bottom: 1px solid var(--border);
}

.brand {
  display: flex;
  align-items: center;
  gap: 14px;
}

.logo {
  width: 50px;
  height: 50px;
  object-fit: contain;
  background: white;
  border-radius: 50%;
  padding: 3px;
}

.school-name {
  font-size: 10px;
  color: var(--gold);
  letter-spacing: 2px;
  font-weight: 700;
}

h1 {
  font: 600 42px "Cormorant Garamond", serif;
  margin: 5px 0;
}

.subtitle {
  color: var(--muted);
  font-size: 12px;
  margin: 0;
}

.refresh {
  border: 1px solid var(--gold);
  background: transparent;
  color: var(--gold-light);
  padding: 11px 17px;
  cursor: pointer;
  transition: .2s;
}

.refresh:hover {
  background: rgba(216,173,104,.12);
}

.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 15px;
  margin: 25px 0;
}

.count {
  color: var(--gold);
  font-size: 14px;
  font-weight: 600;
}

.hint {
  color: var(--muted);
  font-size: 11px;
}

.table-wrap {
  overflow-x: auto;
  border: 1px solid var(--border);
  background: rgba(255,255,255,.015);
}

table {
  width: 100%;
  min-width: 850px;
  border-collapse: collapse;
}

th {
  background: var(--panel);
  color: var(--gold);
  font-size: 10px;
  letter-spacing: 1.5px;
  text-align: left;
  padding: 17px 15px;
  white-space: nowrap;
}

td {
  padding: 15px;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  vertical-align: middle;
}

tbody tr {
  transition: background .2s;
}

tbody tr:hover {
  background: rgba(216,173,104,.045);
}

.student-name {
  color: var(--gold-light);
  font-weight: 600;
}

.message {
  max-width: 240px;
  color: var(--muted);
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.date {
  color: var(--muted);
  white-space: nowrap;
  font-size: 11px;
}

/* Media thumbnail */

.media-preview {
  display: inline-block;
  position: relative;
  cursor: zoom-in;
}

.media-thumb {
  width: 76px;
  height: 58px;
  object-fit: cover;
  display: block;
  background: var(--panel);
  border: 1px solid rgba(216,173,104,.5);
}

.video-thumb {
  position: relative;
}

.video-thumb::after {
  content: "VIDEO";
  position: absolute;
  bottom: 4px;
  left: 4px;
  background: rgba(0,0,0,.8);
  color: white;
  padding: 3px 5px;
  font-size: 8px;
  letter-spacing: 1px;
}

/* Hover preview */

.hover-preview {
  display: none;
  position: absolute;
  z-index: 20;
  left: 50%;
  bottom: 70px;
  transform: translateX(-50%);
  width: 270px;
  padding: 6px;
  background: var(--panel);
  border: 1px solid var(--gold);
  box-shadow: 0 12px 35px rgba(0,0,0,.7);
}

.media-preview:hover .hover-preview,
.media-preview:focus-within .hover-preview {
  display: block;
}

.hover-preview img,
.hover-preview video {
  display: block;
  width: 100%;
  max-height: 220px;
  object-fit: contain;
}

/* Download */

.download {
  display: inline-block;
  padding: 7px 10px;
  border: 1px solid rgba(216,173,104,.4);
  color: var(--gold-light);
  text-decoration: none;
  font-size: 10px;
}

.download:hover {
  background: rgba(216,173,104,.12);
}

/* Fullscreen modal */

.media-modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: rgba(5,3,5,.94);
  backdrop-filter: blur(12px);
  align-items: center;
  justify-content: center;
  flex-direction: column;
  padding: 25px;
}

.media-modal.active {
  display: flex;
}

.media-modal img,
.media-modal video {
  max-width: 95%;
  max-height: 82vh;
  object-fit: contain;
}

.modal-close {
  position: absolute;
  top: 20px;
  right: 25px;
  background: var(--gold);
  color: #21131b;
  border: 0;
  padding: 10px 18px;
  cursor: pointer;
}

.modal-info {
  color: var(--gold-light);
  font-size: 12px;
  margin-top: 15px;
  text-align: center;
}

.empty,
.error {
  padding: 40px;
  text-align: center;
  color: var(--muted);
}

.error {
  color: #ffaaa0;
}

[hidden] {
  display: none !important;
}

@media(max-width:650px) {
  body {
    padding: 20px 4%;
  }

  header {
    align-items: flex-start;
    flex-direction: column;
  }

  h1 {
    font-size: 34px;
  }

  .toolbar {
    align-items: flex-start;
    flex-direction: column;
  }

  .hover-preview {
    display: none !important;
  }
}
</style>
</head>

<body>

<header>
  <div class="brand">
    <img
      src="/assets/school-emblem.png"
      class="logo"
      alt="School logo"
    >

    <div>
      <div class="school-name">
        ST. COLUMBUS PUBLIC SCHOOL · EKDARA, JHAJHA
      </div>

      <h1>Diya Campaign Submissions</h1>

      <p class="subtitle">
        Private school review dashboard
      </p>
    </div>
  </div>

  <button class="refresh" id="refresh">
    ↻ Refresh submissions
  </button>
</header>

<div class="toolbar">
  <div class="count" id="count">
    Loading submissions...
  </div>

  <div class="hint">
    Submitted photos and videos are private.
  </div>
</div>

<div class="table-wrap">

  <table>
    <thead>
      <tr>
        <th>SUBMITTED</th>
        <th>STUDENT</th>
        <th>CLASS</th>
        <th>MESSAGE</th>
        <th>PREVIEW</th>
        <th>DOWNLOAD</th>
      </tr>
    </thead>

    <tbody id="rows"></tbody>
  </table>

  <div class="empty" id="empty" hidden>
    No submissions received yet.
  </div>

</div>

<!-- Media modal -->

<div class="media-modal" id="mediaModal">

  <button class="modal-close" id="closeMedia">
    Close ×
  </button>

  <div id="mediaContent"></div>

  <div class="modal-info" id="modalInfo"></div>

</div>

<script src="/admin.js" defer></script>

</body>
</html>
